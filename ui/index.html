<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Password Generator</title>
  <link rel="icon" href="icons/icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Password Generator Startseite"><img class="brand-mark" src="icons/logo.svg" width="34" height="34" alt=""><span>Passwortgenerator</span></a>
      <span class="local-badge"><span class="dot"></span> Lokal</span>
    </header>
    <section class="workspace" aria-label="Passwortgenerator">
      <div class="output-panel">
        <div class="section-heading"><label for="password">Dein Passwort</label><button id="visibility" class="visibility-button" type="button" aria-label="Passwort verbergen" title="Passwort verbergen" aria-controls="password" aria-pressed="false"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9s3 6 9 6 9-6 9-6M5 12l-2 3m6-1-1 4m7-4 1 4m3-6 2 3"/></svg></button></div>
        <textarea id="password" rows="3" readonly spellcheck="false" autocomplete="off" aria-label="Generiertes Passwort"></textarea>
        <div class="strength-row"><span id="strength-label">Sehr stark</span><span id="entropy">— Bit</span></div>
        <meter id="strength" min="0" max="128" low="50" high="80" optimum="128" value="0" aria-label="Geschätzte Passwortstärke"></meter>
        <div class="actions"><button id="generate" class="secondary" type="button"><span aria-hidden="true">↻</span> Neu erstellen</button><button id="copy" class="primary" type="button">Kopieren</button></div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
      <div class="settings-panel">
        <div class="length-heading"><label for="length">Länge</label><input id="length-number" type="number" min="8" max="128" value="20" aria-label="Passwortlänge als Zahl"></div>
        <input id="length" type="range" min="8" max="128" value="20" aria-label="Passwortlänge">
        <div class="range-labels"><span>8</span><span>128</span></div>
        <fieldset><legend class="sr-only">Zeichen verwenden</legend>
          <label class="option"><span aria-hidden="true">A–Z</span><input id="upper" type="checkbox" aria-label="Großbuchstaben" checked><span class="toggle" aria-hidden="true"></span></label>
          <label class="option"><span aria-hidden="true">a–z</span><input id="lower" type="checkbox" aria-label="Kleinbuchstaben" checked><span class="toggle" aria-hidden="true"></span></label>
          <label class="option"><span aria-hidden="true">0–9</span><input id="digits" type="checkbox" aria-label="Zahlen" checked><span class="toggle" aria-hidden="true"></span></label>
          <label class="option"><span aria-hidden="true">!#&</span><input id="symbols" type="checkbox" aria-label="Sonderzeichen" checked><span class="toggle" aria-hidden="true"></span></label>
        </fieldset>
        <label class="exclude" title="I, l, 1, O, 0 und o ausschließen"><input id="excludeSimilar" type="checkbox"><span>Ähnliche Zeichen vermeiden</span></label>
      </div>
    </section>
    <footer>Nur auf deinem Gerät. Ohne Verlauf.</footer>
  </main>
</body>
</html>
